schema_version = 1
installation = "docker"
extends = "coding@1"

[resources]
cpu = 4
memory = "8GiB"

[runtime_options]
init = "docker"
nftables = true
cgroup = "v1"

[services.docker]
command = "systemctl start docker && exec sleep infinity"
user = "root"
ready_timeout = 90

[services.docker.ready]
exec = ["docker", "info", "--format", "{{.ServerVersion}}"]
