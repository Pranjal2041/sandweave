[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandweave"
version = "0.1.0"
description = "Fast, modular sandboxes for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["questionary>=2,<3"]

[project.urls]
Repository = "https://github.com/Pranjal2041/sandweave"
Documentation = "https://github.com/Pranjal2041/sandweave/blob/main/notes/sdk-usage.md"
Issues = "https://github.com/Pranjal2041/sandweave/issues"

[project.optional-dependencies]
desktop = ["Pillow", "numpy"]
vr = ["Pillow", "numpy", "zstandard"]
test = ["pytest"]

[project.scripts]
sandweave = "sandweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandweave = ["engine-files.txt", "templates/**/*.toml", "templates/**/*.sh", "sandbox/runtimes/gvisor/_engine/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an explicitly configured sandbox worker", "gpu: requires an allocated GPU"]
