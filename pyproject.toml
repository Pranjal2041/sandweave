[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandweave"
version = "0.2.20rc3"
description = "Fast, modular sandboxes for AI agents"
readme = "README.md"
license-files = ["LICENSES/*"]
requires-python = ">=3.11"
dependencies = ["questionary>=2,<3", "rich>=14,<15", "zstandard>=0.23,<1", "aiohttp>=3.12.15,<4"]

[project.urls]
Homepage = "https://pypi.org/project/sandweave/"
Repository = "https://github.com/Pranjal2041/sandweave"
Documentation = "https://pranjal2041.github.io/sandweave/"
Issues = "https://github.com/Pranjal2041/sandweave/issues"

[project.optional-dependencies]
desktop = ["Pillow", "numpy", "pycryptodome>=3.20,<4", "imageio-ffmpeg>=0.6,<0.7"]
vr = ["Pillow", "numpy", "zstandard", "pycryptodome>=3.20,<4", "imageio-ffmpeg>=0.6,<0.7"]
test = ["pytest", "pyte>=0.8,<0.9"]
benchmarks = ["Pillow", "PyYAML", "paramiko>=3.4", "dissect.extfs==3.15", "dissect.hypervisor==3.21", "dissect.volume==3.18"]

[project.scripts]
sandweave = "sandweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandweave = ["engine-files.txt", "runtime-release.json", "templates/**/*.toml", "templates/**/*.sh", "sandbox/runtimes/gvisor/_engine/*", "weave/web/*.html", "weave/web/*.css", "weave/web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an explicitly configured sandbox worker", "gpu: requires an allocated GPU"]
