[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandweave-example-pointmass"
version = "0.1.0"
description = "Small guest simulation demonstrating third-party Sandweave controls"
requires-python = ">=3.11"
dependencies = ["sandweave>=0.1.0"]

[project.entry-points."sandweave.controls.v1"]
pointmass = "pointmass:Provider"

[tool.setuptools]
py-modules = ["pointmass"]
